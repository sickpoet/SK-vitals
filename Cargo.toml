[package]
name = "sk-vitals"
version = "0.1.0"
edition = "2021"
description = "Windows 托盘资源监控：CPU / 内存占用，悬浮小窗 + 托盘变色告警"
license = "MIT"
authors = ["柯夜 <github.com/sickpoet>"]

[dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Environment",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
wmi = "0.18"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
